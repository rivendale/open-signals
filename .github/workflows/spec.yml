name: spec

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check every vector against the reference implementation
        env:
          PYTHONPATH: reference
        run: python -m open_signals.check spec/vectors
      - name: Coverage and consistency tests
        env:
          PYTHONPATH: reference
        run: python -m unittest discover -s reference/tests -v
